name: Build and Deploy to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1                   # set this to your preferred AWS region, e.g. us-west-1
  ECR_REPOSITORY: churn-prediction-app    # set this to your Amazon ECR repository name
  # APP_RUNNER_SERVICE_ARN: arn:aws:apprunner:region:account:service/my-service  # Uncomment if using App Runner deployment step below

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        # It's recommended to use OIDC (role-to-assume) instead of keys for security.
        # role-to-assume: arn:aws:iam::123456789012:role/my-github-actions-role
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        # Build a docker container and
        # push it to ECR so that it can
        # be deployed to AWS App Runner / ECS.
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
        
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    # NOTE: If you are using AWS App Runner with "Automatic Deployment" enabled
    # on your ECR repository, the push step above is enough to trigger a deployment.
    # 
    # If you have manual deployment configured, or want to deploy explicitly via GitHub Actions,
    # you can uncomment the step below:
    
    # - name: Deploy to AWS App Runner
    #   id: deploy-apprunner
    #   uses: awslabs/amazon-app-runner-deploy@main
    #   with:
    #     service: my-app-runner-service
    #     image: ${{ steps.build-image.outputs.image }}
    #     access-role-arn: arn:aws:iam::123456789012:role/my-apprunner-access-role
    #     region: ${{ env.AWS_REGION }}
    #     cpu: 1
    #     memory: 2
    #     port: 8501
    #     wait-for-service-stability-seconds: 1200
